<!doctype html>
<html lang="{{lang}}" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>{{title}}</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style>
    :root {
      color-scheme: light dark;
      supported-color-schemes: light dark;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100% !important;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }

    table, td {
      mso-table-lspace: 0pt;
      mso-table-rspace: 0pt;
    }

    a[x-apple-data-detectors] {
      color: inherit !important;
      text-decoration: none !important;
    }

    @media (max-width: 600px) {
      .card-padding {
        padding: 32px 24px !important;
      }

      .canvas-padding {
        padding: 24px 12px !important;
      }
    }

    /* Mirrors the app's dark theme (onyx canvas, charcoal surface, inverted action) for clients that honor it. */
    @media (prefers-color-scheme: dark) {
      .canvas {
        background-color: #0f0f0f !important;
      }

      .card {
        background-color: #1c1c1c !important;
        border-color: #2b2b2b !important;
      }

      .text-strong {
        color: #ffffff !important;
      }

      .text-body {
        color: #cccccc !important;
      }

      .text-muted {
        color: #888888 !important;
      }

      .divider {
        border-color: #2b2b2b !important;
      }

      .footer-link {
        color: #aaaaaa !important;
      }

      .code-box {
        background-color: #0f0f0f !important;
        border-color: #2b2b2b !important;
      }
    }
  </style>
</head>
<body class="canvas" style="margin: 0; padding: 0; background-color: #f5f5f5; word-spacing: normal;">
  <div style="display: none; max-height: 0; overflow: hidden; mso-hide: all;" aria-hidden="true">
    {{preheader}}&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;
  </div>

  <div role="article" aria-roledescription="email" aria-label="{{title}}" lang="{{lang}}" style="font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <table role="presentation" class="canvas" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f5f5f5;">
      <tr>
        <td class="canvas-padding" align="center" style="padding: 48px 16px;">
          <!--[if mso]>
          <table role="presentation" width="520" cellpadding="0" cellspacing="0" border="0"><tr><td>
          <![endif]-->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width: 520px;">
            <tr>
              <td class="text-strong" style="padding: 0 4px 24px; font-size: 17px; line-height: 24px; font-weight: 700; letter-spacing: -0.01em; color: #0f0f0f;">Olauda</td>
            </tr>

            <tr>
              <td class="card card-padding" style="padding: 40px; background-color: #ffffff; border: 1px solid #e6e6e6; border-radius: 16px;">
                {{content}}
              </td>
            </tr>

            {{disclaimer}}
            {{legal}}
          </table>
          <!--[if mso]>
          </td></tr></table>
          <![endif]-->
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
