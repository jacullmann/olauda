name: CI

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server

      - name: Format
        run: cargo fmt --check

      # Queries are checked against the committed .sqlx cache (SQLX_OFFLINE in
      # .cargo/config.toml), so a query without `cargo sqlx prepare` fails here.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Includes the check that server/openapi.json matches the handlers.
      - name: Test
        run: cargo test --locked

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: API types match server/openapi.json
        run: pnpm api:check

      - name: Lint
        run: pnpm exec eslint "src/**/*.{ts,vue}"

      - name: Format
        run: pnpm exec prettier --check "src/**/*.{ts,vue,css}"

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
