<!doctype html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="robots" content="noindex, nofollow" />
    
    <title>Olauda</title>
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <style>
        :root {
            --initial-loading-background: oklch(1 0 0);
            --initial-loading-spinner: oklch(0 0 0);
            --initial-loading-label: oklch(0.3753 0 0);
        }

        :root.dark {
            --initial-loading-background: oklch(0.1684 0 0);
            --initial-loading-spinner: oklch(1 0 0);
            --initial-loading-label: oklch(0.8452 0 0);
        }

        body {
            background: var(--initial-loading-background);
        }

        #initial-loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            background: var(--initial-loading-background);
            z-index: 99999;
            opacity: 1;
        }

        .initial-loading-spinner {
            width: 36px;
            height: 36px;
            animation: initial-loading-spinner-rotate 2.2s linear infinite;
            transform-origin: center center;
        }

        .initial-loading-spinner circle {
            fill: none;
            stroke: var(--initial-loading-spinner);
            stroke-width: 4;
            stroke-linecap: round;
            stroke-miterlimit: 10;
            stroke-dasharray: 1, 200;
            stroke-dashoffset: 0;
            animation: initial-loading-spinner-element 1.6s ease-in-out infinite;
        }

        .initial-loading-label {
            font-family: 'Satoshi', sans-serif;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.18em;
            color: var(--initial-loading-label);
            text-transform: lowercase;
        }

        @keyframes initial-loading-spinner-rotate {
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes initial-loading-spinner-element {
            0% {
                stroke-dasharray: 1, 200;
                stroke-dashoffset: 0;
            }
            50% {
                stroke-dasharray: 89, 200;
                stroke-dashoffset: -35px;
            }
            100% {
                stroke-dasharray: 89, 200;
                stroke-dashoffset: -124px;
            }
        }
    </style>
</head>
<body>
<div id="initial-loading-screen">
    <svg class="initial-loading-spinner" viewBox="25 25 50 50">
        <circle cx="50" cy="50" r="20"/>
    </svg>
    <div class="initial-loading-label">Olauda</div>
</div>

<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
